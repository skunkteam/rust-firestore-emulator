[package]
name = "firestore-emulator"
description = "Google Cloud Firestore emulator with focus on stability"
version = { workspace = true }
edition = "2024"
rust-version = "1.87"

[features]
default = ["ui"]

# The console feature enables the use of the tokio console for runtime insight in async behavior.
console = ["emulator-tracing/console"]

# Enable the web interface on the same host:port as the other emulator endpoints
ui = ["emulator-http/ui"]

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.0-beta.1"

[workspace.dependencies]
axum = "0.8"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12"
clap = "4.6.7"
color-eyre = "0.6.5"
console-subscriber = "0.5.0"
ctreg = "1.0.3"
emulator-database = { path = "crates/emulator-database" }
emulator-grpc = { path = "crates/emulator-grpc" }
emulator-http = { path = "crates/emulator-http" }
emulator-tracing = { path = "crates/emulator-tracing" }
fifo-rwlock = { path = "crates/fifo-rwlock" }
futures = "0.3.34"
googleapis = { path = "crates/googleapis" }
googletest = "0.14.4"
http = "1.5"
itertools = "0.15.0"
prost = "0.14"
reqwest = "0.13.5"
rstest = "0.28.0"
serde = "1.0.229"
serde_json = "1.0.154"
serde_with = "3.17.0"
static_assertions = "1.1.0"
string_cache = "0.11.0"
thiserror = "2.0.21"
tikv-jemallocator = "0.7.0"
time = "0.3.45"
tokio = "1.54.1"
tokio-stream = "0.1.19"
tokio-test = "0.4.6"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
explicit_outlives_requirements = "forbid"
let_underscore_drop = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
single_use_lifetimes = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
color-eyre = { workspace = true }
emulator-database = { workspace = true }
emulator-grpc = { workspace = true }
emulator-http = { workspace = true }
emulator-tracing = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
