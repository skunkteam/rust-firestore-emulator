[package]
name = "firestore-emulator"
description = "Google Cloud Firestore emulator with focus on stability"
version = { workspace = true }
edition = "2024"
rust-version = { workspace = true }

[features]
default = ["ui"]

# Enable the web interface on the same host:port as the other emulator endpoints
ui = ["emulator-http/ui"]

[lints]
workspace = true

[workspace]
members = ["crates/*"]
exclude = ["tmp"]

[workspace.package]
version = "0.4.0"
rust-version = "1.90"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "tracing"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bytes = "1.12"
clap = "4.6.7"
emulator-database = { path = "crates/emulator-database" }
emulator-grpc = { path = "crates/emulator-grpc" }
emulator-http = { path = "crates/emulator-http", default-features = false }
emulator-tracing = { path = "crates/emulator-tracing" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await"] }
googleapis = { path = "crates/googleapis" }
googletest = "0.14.4"
http = "1.5"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
itertools = "0.14.0"
prost = "0.14"
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
rstest = { version = "0.28.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
string_cache = "0.11.0"
thiserror = "2.0.21"
tikv-jemallocator = "0.7.0"
time = "0.3.45"
tokio = "1.54.1"
tokio-stream = "0.1.19"
tokio-test = "0.4.6"
tonic = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }
tower = "0.5"
tower-http = "0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
explicit_outlives_requirements = "forbid"
let_underscore_drop = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
single_use_lifetimes = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
emulator-database = { workspace = true }
emulator-grpc = { workspace = true }
emulator-http = { workspace = true }
emulator-tracing = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["router"] }
tower = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
