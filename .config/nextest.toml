[profile.default]
failure-output = "immediate-final"
slow-timeout = { period = "15s", terminate-after = 2 }

[profile.ci]
failure-output = "immediate-final"
slow-timeout = { period = "15s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"

[profile.mutants]
failure-output = "never"
slow-timeout = { period = "5s", terminate-after = 1 }
fail-fast = true
default-filter = "not test(/^(proptest_|stress_|multithreaded)/)"
