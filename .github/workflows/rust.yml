name: Rust

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "128"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run workspace tests (default features)
        run: cargo nextest run --workspace --profile ci
      - name: Run workspace tests (no default features)
        run: cargo nextest run --workspace --exclude emulator-tests --no-default-features --profile ci
      - name: Run doctests
        run: cargo test --doc --workspace --exclude googleapis

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo +nightly fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Linting
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  compat-test:
    name: Compatibility test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - run: cargo build --no-default-features
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-suite/package-lock.json
      - name: Run compatibility test suite
        run: npm ci && npm run test:rust-emulator -- --maxConcurrency=3
        working-directory: test-suite

  deploy:
    name: Deploy
    needs:
      - test
      - fmt
      - clippy
      - compat-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Build
        # Intentionally headless (--no-default-features) for CI runners; local installs use `cargo install` (default = ["ui"]).
        run: cargo build --release --no-default-features
      - name: Package
        shell: bash
        run: |
          cd target/release
          tar czvf ../../firestore-emulator.tar.gz firestore-emulator
          cd -
      - name: Publish
        # More info at: https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          # Will be accessible at:
          # - https://github.com/skunkteam/rust-firestore-emulator/releases/latest/download/firestore-emulator.tar.gz
          # - https://github.com/skunkteam/rust-firestore-emulator/releases/download/<tag>/firestore-emulator.tar.gz
          files: firestore-emulator.tar.gz

