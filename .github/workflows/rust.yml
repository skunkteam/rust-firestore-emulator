name: Rust

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

  pull_request:
    branches: ["master"]

  merge_group:
    types: [checks_requested]
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
      PROPTEST_CASES: "128"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-nextest and just
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - name: Run Rust test suite
        run: just test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Enforce formatting
        run: just fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Linting
        run: just clippy

  compat-test:
    name: Compatibility test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-suite/package-lock.json
      - name: Install test-suite dependencies
        run: npm ci
        working-directory: test-suite
      - name: Check test-suite lint and types
        run: just sdk-lint
      - name: Check Web UI JSDoc types
        run: just ui-check
      - name: Run Web UI tests
        run: just ui-test
      - name: Run compatibility test suite
        run: just sdk-test

  deploy:
    name: Deploy
    needs:
      - test
      - fmt
      - clippy
      - compat-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match Cargo.toml workspace.package.version (${cargo_version})"
            exit 1
          fi
          echo "Verified tag ${GITHUB_REF_NAME} matches Cargo.toml version ${cargo_version}"
      - name: Build
        # Intentionally headless (--no-default-features) for CI runners; local installs use `cargo install` (default = ["ui"]).
        run: cargo build --release --no-default-features --locked
      - name: Package
        shell: bash
        run: |
          cd target/release
          tar czvf ../../firestore-emulator.tar.gz firestore-emulator
          cd -
      - name: Publish
        # More info at: https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          # Will be accessible at:
          # - https://github.com/skunkteam/rust-firestore-emulator/releases/latest/download/firestore-emulator.tar.gz
          # - https://github.com/skunkteam/rust-firestore-emulator/releases/download/<tag>/firestore-emulator.tar.gz
          files: firestore-emulator.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

