[package]
name = "emulator-http"
version = { workspace = true }
edition = "2024"

[features]
default = []

# Enable the web interface on the same host:port as the other emulator endpoints
ui = []

[dependencies]
axum = { workspace = true }
emulator-database = { workspace = true }
emulator-tracing = { workspace = true }
googleapis = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower-http = { workspace = true, features = ["set-header", "trace"] }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
googletest = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
